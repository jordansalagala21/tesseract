name: Bug
description: Something is broken
title: "bug: <summary>"
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps to reproduce, property id, expected vs actual" }
    validations: { required: true }
  - type: input
    id: area
    attributes: { label: Area / owner, placeholder: "lib/data, components/..., etc." }
  - type: textarea
    id: logs
    attributes: { label: Logs (REMOVE any secrets or signed URLs) }
